<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us - LearnHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .navbar-custom { background: linear-gradient(90deg, rgba(10,25,47,0.95), rgba(12,36,64,0.95)); box-shadow: 0 2px 8px rgba(0,0,0,0.12); backdrop-filter: blur(6px); }
        .navbar-brand { display:flex; align-items:center; gap:.6rem; color: white !important; }
        .brand-logo{ height:48px; width:48px; object-fit:cover; border-radius:6px; }

        .map-placeholder{ height:320px; background:#e9ecef; display:flex; align-items:center; justify-content:center; color:#6c757d; border-radius:.5rem; }
        .section{ padding:40px 0; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <img src="logo.jpg" class="brand-logo" alt="LearnHub logo">
            <span>Ayra Online Courses</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                <li class="nav-item"><a class="btn btn-warning ms-2 nav-cta" href="login.html">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container section">
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card p-3">
                <h4>Contact Form</h4>
                <form id="contactForm">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="cName">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="cEmail">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" id="cMessage" rows="4"></textarea>
                    </div>
                    <button class="btn btn-primary" type="submit">Send Message</button>
                </form>
                <div id="contactAlert" class="mt-3"></div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card p-3">
                <h4>Our Location</h4>
                <div class="map-placeholder mb-3">Google Map Placeholder</div>

                <h5>Address</h5>
                <p>LearnHub Training Institute<br>
                Hyderabad, Telangana<br>
                📞 +91 9876543210<br>
                ✉ info@learnhub.com</p>

                <h5>Office Hours</h5>
                <p>Mon - Sat: 9:30 AM - 6:30 PM</p>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('contactForm').addEventListener('submit', function(e){
        e.preventDefault();
        const alertEl = document.getElementById('contactAlert');
        alertEl.innerHTML = '<div class="alert alert-success alert-dismissible fade show" role="alert">Message sent successfully! We will get back to you soon.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>';
        this.reset();
    });
</script>

</body>
</html>
